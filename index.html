<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法商图谱 | LawBiz Mindmap</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; }
        
        /* 顶部导航栏 */
        header {
            position: absolute;
            top: 0; left: 0; right: 0; height: 56px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 10;
        }
        header .title { font-size: 18px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        header .subtitle { font-size: 13px; color: #64748b; font-weight: normal; }
        
        /* 画布区域 */
        #svg-container { width: 100vw; height: 100vh; cursor: grab; }
        #svg-container:active { cursor: grabbing; }

        /* 节点样式 */
        .node circle { fill: #fff; stroke-width: 2px; cursor: pointer; transition: all 0.2s; }
        .node circle:hover { r: 8px; filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.5)); }
        
        .node foreignObject { overflow: visible; }
        .node-content {
            display: inline-flex;
            flex-direction: column;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 280px;
            transition: all 0.2s;
        }
        .node-content:hover { border-color: #3b82f6; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .node-title { font-size: 14px; font-weight: 600; color: #0f172a; line-height: 1.4; }
        .node-desc { font-size: 12px; color: #475569; margin-top: 4px; line-height: 1.3; }
        
        /* 节点内置图片样式 */
        .node-img {
            width: 100%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 6px;
            cursor: zoom-in;
            border: 1px solid #f1f5f9;
        }

        /* 连线样式 */
        .link { fill: none; stroke: #94a3b8; stroke-width: 1.5px; stroke-opacity: 0.6; }

        /* 灯箱弹窗（点击图片放大预览） */
        .lightbox {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header>
        <div class="title">
            ⚖️ 法商知识图谱
            <span class="subtitle">| 支持图片与交互折叠的思维导图</span>
        </div>
    </header>

    <div id="svg-container"></div>

    <div class="lightbox" id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="" alt="放大预览">
    </div>

    <script>
        // ==================== 1. 数据配置（在此修改你的图谱内容和图片链接） ====================
        const treeData = {
            name: "法商知识图谱",
            desc: "法律与商业融合的核心知识体系",
            children: [
                {
                    name: "1. 公司治理与股权设计",
                    desc: "顶层架构与合规防控",
                    children: [
                        { 
                            name: "股权结构设计", 
                            desc: "生命线：绝对控制权(67%)、相对控制权(51%)",
                            // 在这里添加节点图片URL
                            img: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=500&auto=format&fit=crop"
                        },
                        { name: "股东协议陷阱", desc: "对赌协议、优先清算权与违约责任条款" }
                    ]
                },
                {
                    name: "2. 合同全生命周期管理",
                    desc: "从拟定、履约到争议解决",
                    children: [
                        { 
                            name: "履约风险控制", 
                            desc: "发货单、对账单与验收确认书盖章要求",
                            img: "https://images.unsplash.com/photo-1450133064473-71024230f91b?w=500&auto=format&fit=crop" 
                        },
                        { name: "违约责任与索赔", desc: "违约金上限计算与损失赔偿范围证明" }
                    ]
                },
                {
                    name: "3. 财税合规与风险防范",
                    desc: "企业稳健运行的财税底线",
                    children: [
                        { 
                            name: "发票与流转税合规", 
                            desc: "三流合一：资金流、发票流、合同流",
                            img: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=500&auto=format&fit=crop"
                        },
                        { name: "高管公私户混同风险", desc: "刑事合规与法人人格否认防范" }
                    ]
                }
            ]
        };

        // ==================== 2. D3.js 动态渲染逻辑 ====================
        const container = d3.select("#svg-container");
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = container.append("svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g");

        // 配置缩放与拖拽 (Zoom & Pan)
        const zoom = d3.zoom()
            .scaleExtent([0.3, 2])
            .on("zoom", (event) => g.attr("transform", event.transform));
        svg.call(zoom);

        // 默认居中位置
        svg.call(zoom.transform, d3.zoomIdentity.translate(150, height / 2).scale(0.9));

        const tree = d3.tree().nodeSize([120, 320]); // 设置节点间距 [垂直间距, 水平间距]
        let i = 0;
        const root = d3.hierarchy(treeData, d => d.children);
        root.x0 = height / 2;
        root.y0 = 0;

        // 更新节点函数
        function update(source) {
            const treeData = tree(root);
            const nodes = treeData.descendants();
            const links = treeData.links();

            // 保持层级深度间距
            nodes.forEach(d => { d.y = d.depth * 300; });

            // ---------------- 节点 (Nodes) ----------------
            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => `translate(${source.y0},${source.x0})`);

            // 节点折叠/展开小圆点
            nodeEnter.append('circle')
                .attr('r', 6)
                .style("fill", d => d._children ? "#3b82f6" : "#fff")
                .style("stroke", "#3b82f6")
                .on('click', (event, d) => {
                    event.stopPropagation();
                    if (d.children) {
                        d._children = d.children;
                        d.children = null;
                    } else {
                        d.children = d._children;
                        d._children = null;
                    }
                    update(d);
                });

            // 使用 HTML 元素渲染丰富的节点内容（包含图片）
            const foreignObject = nodeEnter.append('foreignObject')
                .attr('x', 15)
                .attr('y', -30)
                .attr('width', 280)
                .attr('height', 1); // 自动适应

            const div = foreignObject.append('xhtml:div')
                .attr('class', 'node-content');

            div.html(d => `
                <div class="node-title">${d.data.name}</div>
                ${d.data.desc ? `<div class="node-desc">${d.data.desc}</div>` : ''}
                ${d.data.img ? `<img class="node-img" src="${d.data.img}" onclick="showLightbox('${d.data.img}', event)" />` : ''}
            `);

            // 节点位置过渡
            const nodeUpdate = nodeEnter.merge(node);
            nodeUpdate.transition()
                .duration(300)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            nodeUpdate.select('circle')
                .style("fill", d => d._children ? "#3b82f6" : "#fff");

            const nodeExit = node.exit().transition()
                .duration(300)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();

            // ---------------- 连线 (Links) ----------------
            const link = g.selectAll('path.link')
                .data(links, d => d.target.id);

            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', d => {
                    const o = { x: source.x0, y: source.y0 };
                    return diagonal(o, o);
                });

            const linkUpdate = linkEnter.merge(link);
            linkUpdate.transition()
                .duration(300)
                .attr('d', d => diagonal(d.source, d.target));

            link.exit().transition()
                .duration(300)
                .attr('d', d => {
                    const o = { x: source.x, y: source.y };
                    return diagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        // 贝塞尔曲线连接线计算
        function diagonal(s, d) {
            return `M ${s.y} ${s.x}
                    C ${(s.y + d.y) / 2} ${s.x},
                      ${(s.y + d.y) / 2} ${d.x},
                      ${d.y} ${d.x}`;
        }

        // 初始化渲染
        update(root);

        // 灯箱展示逻辑
        function showLightbox(url, e) {
            e.stopPropagation();
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }

        // 窗口缩放自适应
        window.addEventListener('resize', () => {
            svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
        });
    </script>
</body>
</html>
