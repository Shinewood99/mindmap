<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法商知识图谱 - ydzl.net</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #f8fafc; color: #0f172a; overflow: hidden; }
        
        /* 顶部控制栏 */
        .toolbar {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 8px 12px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex; gap: 12px; border: 1px solid #e2e8f0;
        }
        .btn-group { display: flex; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; }
        .btn-group button {
            border: none; background: #fff; padding: 8px 16px; font-size: 14px; font-weight: 500;
            color: #475569; cursor: pointer; transition: all 0.2s;
        }
        .btn-group button.active { background: #2563eb; color: #fff; font-weight: 600; }
        .btn-group button:not(:last-child) { border-right: 1px solid #cbd5e1; }

        /* 视图容器 */
        #mindmap-container, #outliner-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #outliner-container {
            display: none; overflow-y: auto; padding: 100px 20% 60px; background: #ffffff;
        }

        /* D3 连线 */
        .link { fill: none; stroke: #94a3b8; stroke-width: 2.5px; }
        
        /* HTML 自适应节点卡片样式 */
        .node-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            padding: 10px 20px;
            border-radius: 10px;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            box-shadow: 0 6px 12px -2px rgba(15, 23, 42, 0.08);
            font-size: 15px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .node-card:hover {
            border-color: #2563eb;
            box-shadow: 0 8px 16px -2px rgba(37, 99, 235, 0.2);
            transform: translateY(-2px);
        }

        /* 根节点样式 */
        .node-depth-0 .node-card {
            background: #1e293b;
            color: #ffffff;
            border-color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            padding: 12px 24px;
        }

        /* 二级节点样式 */
        .node-depth-1 .node-card {
            background: #eff6ff;
            color: #1e40af;
            border-color: #3b82f6;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 22px;
        }

        /* 幕布大纲样式 */
        .outline-tree h2 { font-size: 28px; margin-bottom: 20px; color: #0f172a; }
        .outline-tree ul { list-style: none; padding-left: 24px; border-left: 2px solid #e2e8f0; margin-left: 8px; }
        .outline-tree li { margin: 12px 0; }
        .outline-item { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; color: #1e293b; }
        .outline-bullet { width: 10px; height: 10px; background: #2563eb; border-radius: 50%; display: inline-block; }
        .outline-desc { font-size: 14px; color: #64748b; font-weight: normal; margin-left: 20px; display: block; margin-top: 2px; }
        .outline-img { max-width: 260px; border-radius: 8px; margin: 8px 0 8px 20px; cursor: pointer; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Lightbox */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); z-index: 200; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="btn-group">
            <button id="btn-mindmap" class="active" onclick="switchView('mindmap')">🧠 导图模式</button>
            <button id="btn-outliner" onclick="switchView('outliner')">📝 幕布大纲</button>
        </div>
        <div class="btn-group" id="dir-group">
            <button id="btn-vertical" class="active" onclick="switchDirection('vertical')">⬇️ 竖向</button>
            <button id="btn-horizontal" onclick="switchDirection('horizontal')">➡️ 横向</button>
        </div>
    </div>

    <!-- 导图容器 -->
    <div id="mindmap-container"><svg id="svg"></svg></div>

    <!-- 幕布大纲容器 -->
    <div id="outliner-container"><div class="outline-tree" id="outline-tree"></div></div>

    <!-- 图片弹窗 -->
    <div class="lightbox" id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="" alt="预览图">
    </div>

<script>
const data = {
    name: "法商核心体系",
    children: [
        {
            name: "公司股权架构",
            desc: "控制权设计与对赌协议",
            children: [
                { name: "动态股权设计", desc: "按阶段分配和收回机制" },
                { name: "控制权防线", desc: "章程约定与表决权委托" }
            ]
        },
        {
            name: "财税合规管理",
            desc: "账目合规与风险防范",
            children: [
                { name: "公私户合规", desc: "避免公私混同带来的无限连带责任" },
                { name: "税务筹划", desc: "依法享受地方政策及研发扣除" }
            ]
        },
        {
            name: "核心资产保护",
            children: [
                { name: "知识产权防线", desc: "商标、专利与商业秘密隔离" }
            ]
        }
    ]
};

let currentLayout = 'vertical';

const width = window.innerWidth;
const height = window.innerHeight;
const svg = d3.select("#svg").attr("width", width).attr("height", height);
const g = svg.append("g");

// 拖拽缩放行为
const zoomBehavior = d3.zoom()
    .scaleExtent([0.3, 3])
    .on("zoom", (e) => g.attr("transform", e.transform));

svg.call(zoomBehavior);

const root = d3.hierarchy(data);

function renderTree() {
    g.selectAll("*").remove();

    // 节点布局及间距设定
    const treeLayout = d3.tree()
        .nodeSize(currentLayout === 'vertical' ? [280, 160] : [90, 300]);

    treeLayout(root);

    // 绘制连线
    g.selectAll(".link")
        .data(root.links())
        .enter().append("path")
        .attr("class", "link")
        .attr("d", currentLayout === 'vertical' 
            ? d3.linkVertical().x(d => d.x).y(d => d.y)
            : d3.linkHorizontal().x(d => d.y).y(d => d.x)
        );

    // 绘制节点
    const node = g.selectAll(".node")
        .data(root.descendants())
        .enter().append("g")
        .attr("class", d => `node node-depth-${d.depth}`)
        .attr("transform", d => currentLayout === 'vertical' 
            ? `translate(${d.x},${d.y})` 
            : `translate(${d.y},${d.x})`);

    const fo = node.append("foreignObject")
        .attr("width", 280)
        .attr("height", 70)
        .attr("x", -140)
        .attr("y", -28);

    fo.append("xhtml:div")
        .style("display", "flex")
        .style("justify-content", "center")
        .style("align-items", "center")
        .style("width", "100%")
        .style("height", "100%")
        .html(d => `<div class="node-card">${d.data.name}</div>`);

    // 自动自适应居中并放大充满窗口 (Fit View)
    setTimeout(fitView, 50);
}

function fitView() {
    const bbox = g.node().getBBox();
    if (bbox.width === 0 || bbox.height === 0) return;

    const fullWidth = window.innerWidth;
    const fullHeight = window.innerHeight;

    const width = bbox.width;
    const height = bbox.height;
    const midX = bbox.x + width / 2;
    const midY = bbox.y + height / 2;

    // 预留 padding 比例
    const scale = Math.min(fullWidth / (width + 160), fullHeight / (height + 160)) * 0.9;
    const translate = [fullWidth / 2 - scale * midX, fullHeight / 2 - scale * midY];

    svg.transition().duration(500).call(
        zoomBehavior.transform,
        d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
    );
}

// 幕布渲染逻辑
function renderOutliner(node, targetEl) {
    const ul = document.createElement('ul');
    node.children?.forEach(item => {
        const li = document.createElement('li');
        let html = `<div class="outline-item"><span class="outline-bullet"></span><span>${item.name}</span></div>`;
        if (item.desc) html += `<span class="outline-desc">${item.desc}</span>`;
        if (item.img) html += `<img src="${item.img}" class="outline-img" onclick="showImg('${item.img}')">`;
        li.innerHTML = html;
        if (item.children && item.children.length > 0) {
            renderOutliner(item, li);
        }
        ul.appendChild(li);
    });
    targetEl.appendChild(ul);
}

function switchView(mode) {
    document.getElementById('btn-mindmap').classList.toggle('active', mode === 'mindmap');
    document.getElementById('btn-outliner').classList.toggle('active', mode === 'outliner');
    
    document.getElementById('mindmap-container').style.display = mode === 'mindmap' ? 'block' : 'none';
    document.getElementById('outliner-container').style.display = mode === 'outliner' ? 'block' : 'none';
    document.getElementById('dir-group').style.display = mode === 'mindmap' ? 'flex' : 'none';

    if (mode === 'mindmap') setTimeout(fitView, 50);
}

function switchDirection(dir) {
    currentLayout = dir;
    document.getElementById('btn-vertical').classList.toggle('active', dir === 'vertical');
    document.getElementById('btn-horizontal').classList.toggle('active', dir === 'horizontal');
    renderTree();
}

function showImg(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
}

window.addEventListener('resize', () => {
    svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
    fitView();
});

// 初始化
renderTree();
const outlineRoot = document.getElementById('outline-tree');
outlineRoot.innerHTML = `<h2>${data.name}</h2>`;
renderOutliner(data, outlineRoot);
</script>
</body>
</html>
